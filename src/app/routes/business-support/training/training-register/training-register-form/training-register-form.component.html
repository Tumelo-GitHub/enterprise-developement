<form [formGroup]="form" novalidate (ngSubmit)="onSubmit()">
    <h2 mat-dialog-title>Training Event</h2>
    <mat-dialog-content class="mat-typography">
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select cdkFocusInitial placeholder="Beneficiary" formControlName="smme_id">
                        <mat-option *ngFor="let beneficiary of beneficiaryList" [value]="beneficiary.id">{{beneficiary.smme_name}}</mat-option>
                    </mat-select>
                    <mat-error *ngIf="form.controls['smme_id'].hasError('required')">
                        Beneficiary is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput type="text" placeholder="Full Names" formControlName="attendee">
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput type="number" placeholder="Age" formControlName="age">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput type="email" placeholder="Email" formControlName="email">
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput type="text" placeholder="Contact Number" formControlName="tel_number">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select placeholder="Qualification" formControlName="qualification">
                        <mat-option *ngFor="let qualification of qualifications" [value]="qualification">{{ qualification }}</mat-option>
                    </mat-select>
                    <mat-error *ngIf="form.controls['qualification'].hasError('required')">
                        qualification is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select placeholder="Gender" formControlName="gender">
                        <mat-option *ngFor="let gender of genderOptions" [value]="gender.value">{{ gender.description }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cancel</button>
        <button type="submit" mat-button [disabled]="!form.valid">Submit</button>
    </mat-dialog-actions>
</form>
