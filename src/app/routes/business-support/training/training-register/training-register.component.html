<div class="tab-content">
    <div class="controls">
        <mat-form-field>
            <mat-label>Filter</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
        </mat-form-field>
        <button mat-icon-button matTooltip="Export Table To PDF" (click)="exportTableToPDF()">
            <i class="fa-regular fa-file-pdf fa-xl"></i>
          </button>
    </div>

    <div class="mat-elevation-z8">
        <table id="TrainingEventRegisterTable" mat-table [dataSource]="dataSource" matSort class="full-width-table">
            <ng-container matColumnDef="smme_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> SMME Name </th>
                <td mat-cell *matCellDef="let row"> {{row.smme_name}} </td>
            </ng-container>

            <ng-container matColumnDef="attendee">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Full Names </th>
                <td mat-cell *matCellDef="let row"> {{row.attendee}} </td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                <td mat-cell *matCellDef="let row"> {{row.email}} </td>
            </ng-container>

            <ng-container matColumnDef="tel_number">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Tel Number </th>
                <td mat-cell *matCellDef="let row"> {{row.tel_number}} </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button matTooltip="Edit Employee" color="accern" (click)="openDialog(row)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button matTooltip="Delete Employee" color="warn" (click)="deleteRecord(row)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="7">No data matching the filter "{{input.value}}"</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
    <div class="add-btn-wrapper" color="primary">
        <button mat-fab matTooltip="Add Event" aria-label="Add Training Event Button with icon" class="add-btn" (click)="openDialog()">
          <mat-icon>add</mat-icon>
        </button>
    </div>
</div>
