<div class="tab-content">
    <div class="table-controls">
        <mat-form-field>
            <mat-label>Filter</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
            <!-- <mat-label for="">Table columns</mat-label>
            <mat-select [formControl]="columns" [(ngModel)]="columnsToDisplay"
                (selectionChange)="selectedToppings($event)" multiple>
                <mat-option *ngFor="let column of columnsList" [value]="column[1]">{{column[0]}}</mat-option>
            </mat-select> -->
        </mat-form-field>

        <mat-form-field style="float: right;" id="searchInput">
            <mat-label>Search</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
        </mat-form-field>
        <button mat-icon-button matTooltip="Export Table To Excel" (click)="exportTable()">
            <i class="fa-regular fa-file-excel fa-xl"></i>
        </button>
        <button mat-icon-button matTooltip="Export Table To PDF" (click)="exportTableToPDF()">
            <i class="fa-regular fa-file-pdf fa-xl"></i>
        </button>
        <button mat-icon-button matTooltip="Load Register" (click)="loadRegister()">
            <mat-icon>subject</mat-icon>
        </button>
    </div>

    <div class="mat-elevation-z8">
        <table id="TrainingEventTable" mat-table [dataSource]="dataSource" matSort
            class="full-width-table selectable-row-table">
            <!-- Checkbox Column -->
            <ng-container matColumnDef="select">
                <th mat-header-cell *matHeaderCellDef>
                    <mat-checkbox (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
                    </mat-checkbox>
                </td>
            </ng-container>

            <ng-container matColumnDef="programme_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Programme </th>
                <td mat-cell *matCellDef="let row"> {{row.programme_name}} </td>
            </ng-container>

            <ng-container matColumnDef="service_provider_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Trainer </th>
                <td mat-cell *matCellDef="let row"> {{row.service_provider_name}} </td>
            </ng-container>

            <ng-container matColumnDef="course_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Course </th>
                <td mat-cell *matCellDef="let row"> {{row.course_name}} </td>
            </ng-container>

            <ng-container matColumnDef="address">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Address </th>
                <td mat-cell *matCellDef="let row"> {{row.address}} </td>
            </ng-container>

            <ng-container matColumnDef="event_date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
                <td mat-cell *matCellDef="let row"> {{row.event_date}} </td>
            </ng-container>

            <ng-container matColumnDef="time">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Time </th>
                <td mat-cell *matCellDef="let row"> {{row.start_time + ' - ' + row.end_time}} </td>
            </ng-container>

            <ng-container matColumnDef="status_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
                <td mat-cell *matCellDef="let row"> {{row.status_name}} </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
                <td mat-cell *matCellDef="let row" class="w-120">
                    <button mat-icon-button matTooltip="Edit Event" color="accern"
                        (click)="openDialog(row); $event.stopPropagation();">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button matTooltip="Delete Event" color="warn"
                        (click)="deleteEmp(row); $event.stopPropagation();">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                (click)="selection.toggle(row)" [class.selected-row]="clickedRow == row"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="7">No data matching the filter "{{input.value}}"</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
    <div class="add-btn-wrapper" color="primary">
        <button mat-fab matTooltip="Add Event" aria-label="Add Training Event Button with icon" class="add-btn"
            (click)="openDialog()">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</div>
