<div class="tab-content">
    <mat-form-field>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>

    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort class="full-width-table selectable-row-table">
            <ng-container matColumnDef="programme_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Programme </th>
                <td mat-cell *matCellDef="let row"> {{row.programme_name}} </td>
            </ng-container>

            <ng-container matColumnDef="service_provider_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Trainer </th>
                <td mat-cell *matCellDef="let row"> {{row.service_provider_name}} </td>
            </ng-container>

            <ng-container matColumnDef="course_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Course </th>
                <td mat-cell *matCellDef="let row"> {{row.course_name}} </td>
            </ng-container>

            <ng-container matColumnDef="address">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Address </th>
                <td mat-cell *matCellDef="let row"> {{row.address}} </td>
            </ng-container>

            <ng-container matColumnDef="event_date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
                <td mat-cell *matCellDef="let row"> {{row.event_date}} </td>
            </ng-container>

            <ng-container matColumnDef="time">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Time </th>
                <td mat-cell *matCellDef="let row"> {{row.start_time + ' - ' + row.end_time}} </td>
            </ng-container>

            <ng-container matColumnDef="status_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
                <td mat-cell *matCellDef="let row"> {{row.status_name}} </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
                <td mat-cell *matCellDef="let row" class="w-120">
                    <button mat-icon-button matTooltip="Invited Beneficiaries" color="accern" (click)="openDialog(row)">
                        <mat-icon>list</mat-icon>
                    </button>
                    <button mat-icon-button matTooltip="Edit Event" color="accern" (click)="openDialog(row); $event.stopPropagation();">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button matTooltip="Delete Event" color="warn" (click)="deleteEmp(row); $event.stopPropagation();">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="getClickedRow(row);" [class.selected-row]="clickedRow == row"></tr>
        
            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="7">No data matching the filter "{{input.value}}"</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
    <div class="add-btn-wrapper" color="primary">
        <button mat-fab matTooltip="Add Event" aria-label="Add Training Event Button with icon" class="add-btn" (click)="openDialog()">
          <mat-icon>add</mat-icon>
        </button>
    </div>
</div>
