<div class="container">
    <div class="page-title">
        <h2>Training Venues</h2>
    </div>
    <!-- <button mat-raised-button aria-label="Example icon button with a home icon" color="primary" class="add-btn" (click)="removeColumn()">
        Add Employee
    </button> -->
    
    <mat-form-field>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>
      
    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort class="full-width-table">
      
          <ng-container matColumnDef="venue_name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Venue Name </th>
            <td mat-cell *matCellDef="let row"> {{row.venue_name}} </td>
          </ng-container>
      
          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Address </th>
            <td mat-cell *matCellDef="let row"> {{row.address}} </td>
          </ng-container>
      
          <ng-container matColumnDef="tel_number">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Telephone Number </th>
            <td mat-cell *matCellDef="let row"> {{row.tel_number}} </td>
          </ng-container>
      
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
            <td mat-cell *matCellDef="let row"> {{row.email}} </td>
          </ng-container>
    
          <!-- Action Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef> Action </th>
            <td mat-cell *matCellDef="let row">
                <button mat-icon-button color="accern" (click)="openDialog(row)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteVenue(row.id)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
          </ng-container>
      
          <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
          <tr mat-row *matRowDef="let row; columns: columnsToDisplay;"></tr>
      
          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
          </tr>
        </table>
      
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>    
    <div class="add-btn-wrapper" color="primary">
      <button mat-fab matTooltip="Add Company" aria-label="Add Employee Button with icon" class="add-btn" (click)="openDialog()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
</div>
