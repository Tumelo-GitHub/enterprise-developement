<form [formGroup]="form" novalidate (ngSubmit)="onSubmit()">
    <mat-card-header class="card-header">
        <mat-card-title class="login-title">Forgot Password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput placeholder="Email" formControlName="email">
                    <mat-error *ngIf="form.controls['email'].hasError('required')">
                        Email is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <div class="server-error">

        </div>
    </mat-card-content>
    <mat-card-actions>
        <button mat-raised-button style="width: -webkit-fill-available;" color="primary" type="submit">Submit</button>
    </mat-card-actions>
    <div>
        <p>Don't have account? <a routerLink="/auth/register"><span class="sign-up-link"> Sign up </span></a></p>
    </div>
</form>
