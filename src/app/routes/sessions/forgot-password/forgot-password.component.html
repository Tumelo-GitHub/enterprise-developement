<div class="auth-form-wrapper">
    <!-- Form Header -->
    <div class="form-header">
        <div class="header-icon">
            <mat-icon>lock_reset</mat-icon>
        </div>
        <h1 class="form-title">Reset Password</h1>
        <p class="form-subtitle">Enter your email to receive a reset link</p>
    </div>

    <!-- Reset Password Form -->
    <form [formGroup]="form" novalidate (ngSubmit)="onSubmit()" class="modern-auth-form">
        <mat-form-field appearance="outline" class="auth-field">
            <mat-label>Email Address</mat-label>
            <input matInput type="email" formControlName="email" placeholder="john.doe@example.com">
            <mat-icon matPrefix>email</mat-icon>
            <mat-error *ngIf="form.get('email')?.hasError('required')">
                Email is required
            </mat-error>
            <mat-error *ngIf="form.get('email')?.hasError('email')">
                Please enter a valid email
            </mat-error>
        </mat-form-field>

        <!-- Submit Button -->
        <button mat-raised-button 
                type="submit" 
                class="auth-submit-btn"
                [disabled]="form.invalid || isSubmitting">
            <mat-icon>send</mat-icon>
            {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
        </button>

        <!-- Success Message -->
        <div class="success-message" *ngIf="emailSent">
            <mat-icon>check_circle</mat-icon>
            <p>Reset link sent! Please check your email.</p>
        </div>

        <!-- Form Footer -->
        <div class="form-footer">
            <p>Remember your password?</p>
            <a routerLink="/auth/login" class="secondary-link">
                <mat-icon>login</mat-icon>
                Back to Sign In
            </a>
        </div>
    </form>
</div>
