<form [formGroup]="form" novalidate (ngSubmit)="onSubmit()">
    <h2 mat-dialog-title>Appoint Beneficiaries</h2>
    <mat-dialog-content class="mat-typography">
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select *ngIf="!data.id" cdkFocusInitial formControlName="bdsp_id" placeholder="Company" multiple>
                        <mat-option *ngFor="let company of companyList" [value]="company.id">{{ company.bdsp_name }}</mat-option>
                    </mat-select>
                    <mat-select *ngIf="data.id" cdkFocusInitial formControlName="bdsp_id" placeholder="Company">
                        <mat-option *ngFor="let company of companyList" [value]="company.id">{{ company.bdsp_name }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Appointment date</mat-label>
                    <input matInput [matDatepicker]="picker1" formControlName="appointment_date">
                    <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                    <mat-datepicker #picker1></mat-datepicker>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Contract start date</mat-label>
                    <input matInput [matDatepicker]="picker2" formControlName="contract_start_date">
                    <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                    <mat-datepicker #picker2></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Contract end date</mat-label>
                    <input matInput [matDatepicker]="picker3" formControlName="contract_end_date">
                    <mat-datepicker-toggle matSuffix [for]="picker3"></mat-datepicker-toggle>
                    <mat-datepicker #picker3></mat-datepicker>
                </mat-form-field>
            </div>
        </div>
        <!-- <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Service request start date</mat-label>
                    <input matInput [matDatepicker]="picker4" formControlName="service_request_start_date">
                    <mat-datepicker-toggle matSuffix [for]="picker4"></mat-datepicker-toggle>
                    <mat-datepicker #picker4></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Service request end date</mat-label>
                    <input matInput [matDatepicker]="picker5" formControlName="service_request_end_date">
                    <mat-datepicker-toggle matSuffix [for]="picker5"></mat-datepicker-toggle>
                    <mat-datepicker #picker5></mat-datepicker>
                </mat-form-field>
            </div>
        </div> -->
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <textarea matInput placeholder="Engagement Description" formControlName="description"></textarea>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cancel</button>
        <button type="submit" mat-button [disabled]="!form.valid">Submit</button>
    </mat-dialog-actions>
</form>
