<!-- Action Bar -->
<app-table-action-bar
  [isLoading]="isLoading"
  [filterLabel]="'Search courses'"
  [filterPlaceholder]="'Search by course name, status, or budget'"
  [addButtonText]="'Add Course'"
  [addButtonIcon]="'add'"
  (openDialog)="openAddCourseForm()"
  (applyFilter)="applyFilterFromEvent($event)">
</app-table-action-bar>

<!-- Data Table Section -->
<div class="table-section">
  <!-- Loading Section -->
  <div class="loading-section" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Loading courses...</p>
  </div>

  <!-- Table Card -->
  <mat-card class="table-card" *ngIf="!isLoading">
    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" matSort class="data-table">
        
        <ng-container matColumnDef="course_name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="header-cell">
            <mat-icon>school</mat-icon>
            Course Name
          </th>
          <td mat-cell *matCellDef="let row" class="data-cell">
            <div class="course-info">
              <span class="course-name">{{row.course_name}}</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="status_name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="header-cell">
            <mat-icon>info</mat-icon>
            Status
          </th>
          <td mat-cell *matCellDef="let row" class="data-cell">
            <span [class]="'status-badge ' + getStatusClass(row.status)">
              {{row.status_name}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="budget">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="header-cell">
            <mat-icon>monetization_on</mat-icon>
            Budget
          </th>
          <td mat-cell *matCellDef="let row" class="data-cell">
            <span class="budget-amount">{{row.budget | currency:'ZAR'}}</span>
          </td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="header-cell actions-header">
            <mat-icon>settings</mat-icon>
            Actions
          </th>
          <td mat-cell *matCellDef="let row" class="data-cell actions-cell">
            <div class="action-buttons">
              <button mat-icon-button 
                      matTooltip="Edit Course" 
                      matTooltipPosition="above"
                      (click)="editCourse(row)" 
                      class="edit-btn">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button 
                      matTooltip="Delete Course" 
                      matTooltipPosition="above"
                      (click)="deleteRecord(row)" 
                      class="delete-btn">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
        <tr mat-row *matRowDef="let row; columns: columnsToDisplay;" class="table-row"></tr>

        <!-- No Data Row -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="columnsToDisplay.length">
            <div class="no-data">
              <div class="no-data-content">
                <mat-icon class="no-data-icon">school_outlined</mat-icon>
                <h3>No courses found</h3>
                <p>No courses assigned to this programme</p>
              </div>
            </div>
          </td>
        </tr>
      </table>

      <!-- Paginator -->
      <mat-paginator 
        [pageSizeOptions]="[5, 10, 25, 100]"
        [pageSize]="10"
        [showFirstLastButtons]="true"
        class="table-paginator"
        aria-label="Select page of courses">
      </mat-paginator>
    </div>
  </mat-card>
</div>
