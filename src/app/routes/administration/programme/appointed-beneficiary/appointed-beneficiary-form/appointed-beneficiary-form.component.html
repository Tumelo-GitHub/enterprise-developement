<form [formGroup]="form" novalidate (ngSubmit)="onSubmit()">
    <h2 mat-dialog-title>Appoint Beneficiaries</h2>
    <mat-dialog-content class="mat-typography">
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select cdkFocusInitial *ngIf="!data.id" formControlName="smme_id" placeholder="Beneficiaries" multiple>
                        <mat-option *ngFor="let company of companyList" [value]="company.id">{{ company.smme_name }}</mat-option>
                    </mat-select>
                    <mat-select cdkFocusInitial *ngIf="data.id" formControlName="smme_id" placeholder="Beneficiaries">
                        <mat-option *ngFor="let company of companyList" [value]="company.id">{{ company.smme_name }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select placeholder="Status" formControlName="status">
                        <mat-option *ngFor="let status of status" value="{{ status.id }}">{{ status.status_name }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Appointment date</mat-label>
                    <input matInput [matDatepicker]="picker1" formControlName="appointment_date">
                    <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                    <mat-datepicker #picker1></mat-datepicker>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cancel</button>
        <button type="submit" mat-button [disabled]="!form.valid">Submit</button>
    </mat-dialog-actions>
</form>
