<div class="tab-content">
    <mat-form-field>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>

    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort class="full-width-table">

            <ng-container matColumnDef="smme_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Beneficiary </th>
                <td mat-cell *matCellDef="let row"> {{row.smme_name}} </td>
            </ng-container>

            <ng-container matColumnDef="status_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
                <td mat-cell *matCellDef="let row"> {{row.status_name}} </td>
            </ng-container>

            <ng-container matColumnDef="appointment_date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Appointed Date </th>
                <td mat-cell *matCellDef="let row"> {{row.appointment_date}} </td>
            </ng-container>

            <ng-container matColumnDef="documents">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Documents </th>
                <td mat-cell *matCellDef="let row"> {{row.documents}} </td>
            </ng-container>

            <!-- Action Column -->
            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef> Action </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button matTooltip="Edit" color="accern" (click)="openDialog(row)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button matTooltip="Delete" color="warn" (click)="deleteAppointment(row)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
            <tr mat-row *matRowDef="let row; columns: columnsToDisplay;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="8">No data matching the filter "{{input.value}}"</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
    <div class="add-btn-wrapper" color="primary">
        <button mat-fab matTooltip="Add Service Provider" aria-label="Add Service Provider Button with icon"
            class="add-btn" (click)="openDialog()">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</div>
