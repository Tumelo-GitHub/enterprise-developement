<div class="container">
    <div class="page-title">
        <h2>Programme {{(programme) ? ' : ' + programme.programme_name : ''}}</h2>
    </div>
    <mat-tab-group animationDuration="0ms">
        <mat-tab label="Programmes">
            <app-programme-table (onProgrammeSelection)="programme = $event"></app-programme-table>
        </mat-tab>
        <mat-tab label="Linked Course">
            <app-programme-course [programme]="programme"></app-programme-course>
        </mat-tab>
        <mat-tab label="Appointed Beneficiaries">
            <app-appointed-beneficiary [programme]="programme"></app-appointed-beneficiary>
        </mat-tab>
        <mat-tab label="Appointed BDSP">
            <app-appointed-bdsp [programme]="programme"></app-appointed-bdsp>
        </mat-tab>
        <mat-tab label="Documents">
            Document Content
        </mat-tab>
    </mat-tab-group>
</div>
