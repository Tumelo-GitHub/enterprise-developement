<div class="form-container">
  <mat-card class="form-card">
    <div class="form-header">
      <h2 class="form-title">{{ isEditMode ? 'Edit Service Provider' : 'Add Service Provider' }}</h2>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-row two-columns">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Surname</mat-label>
          <input matInput formControlName="surname" />
        </mat-form-field>
      </div>

      <div class="form-row two-columns">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Company Name</mat-label>
          <input matInput formControlName="company_name" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>City</mat-label>
          <input matInput formControlName="city" />
        </mat-form-field>
      </div>

      <div class="form-row two-columns">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Province</mat-label>
          <input matInput formControlName="province" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" />
        </mat-form-field>
      </div>

      <div class="form-row two-columns">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Cell Number</mat-label>
          <input matInput formControlName="cell_no" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Tel Number</mat-label>
          <input matInput formControlName="tel_no" />
        </mat-form-field>
      </div>

      <div class="form-row two-columns">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Service Type</mat-label>
          <input matInput formControlName="service_type" />
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Comment</mat-label>
          <textarea matInput formControlName="comment" rows="4"></textarea>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button type="button" mat-stroked-button (click)="onCancel()">Cancel</button>
        <button type="submit" mat-raised-button color="primary">{{ isEditMode ? 'Update' : 'Save' }}</button>
      </div>
    </form>
  </mat-card>
</div>
