<form [formGroup]="form" novalidate (ngSubmit)="generateInvoice()">
    <h2 mat-dialog-title>Invoice</h2>
    <mat-dialog-content class="mat-typography">
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select placeholder="Project" formControlName="project_id">
                        <mat-option *ngFor="let option of projects"
                            value="{{option.id}}">{{option.project_name}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input type="number" matInput placeholder="Hourly Rate" formControlName="rate">
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cancel</button>
        <button type="submit" mat-button [disabled]="!form.valid">Generate Invoice</button>
    </mat-dialog-actions>
</form>
