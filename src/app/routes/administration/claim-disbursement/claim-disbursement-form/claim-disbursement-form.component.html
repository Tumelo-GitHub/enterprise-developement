<form [formGroup]="form" novalidate (ngSubmit)="onSubmit()">
    <h2 mat-dialog-title>Claim Disbursement</h2>
    <mat-dialog-content class="mat-typography">
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput placeholder="Item Name" formControlName="item_name">
                    <mat-error *ngIf="form.controls['item_name'].hasError('required')">
                        Item is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input type="number" matInput placeholder="units" formControlName="units">
                    <mat-error *ngIf="form.controls['units'].hasError('required')">
                        Item is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Amount</mat-label>
                    <input type="number" matInput class="example-right-align" placeholder="0" formControlName="price_per_unit">
                    <span matPrefix>R&nbsp;</span>
                    <mat-error *ngIf="form.controls['price_per_unit'].hasError('required')">
                        Item is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Date</mat-label>
                    <input matInput [matDatepicker]="picker1" formControlName="date">
                    <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                    <mat-datepicker #picker1></mat-datepicker>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cancel</button>
        <button type="submit" mat-button [disabled]="!form.valid">Submit</button>
    </mat-dialog-actions>
</form>
