<div class="container">
    <!-- <div class="page-title">
        <h2>Claim Disbursement</h2>
    </div> -->

    <div class="table-controls">
        <mat-form-field>
            <mat-label for="columnsSelection">Table columns</mat-label>
            <mat-select name="columnsSelection" [formControl]="columns" [(ngModel)]="columnsToDisplay"
                (selectionChange)="selectedColumns($event)" multiple>
                <mat-option *ngFor="let column of columnList" [value]="column[0]">{{column[1]}}</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field style="float: right;" id="searchInput">
            <mat-label>Search</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
        </mat-form-field>
        <button mat-icon-button matTooltip="Export Table To Excel" (click)="openDialog()">
            <mat-icon>add</mat-icon>
        </button>
        <!-- <button mat-icon-button matTooltip="Export Table To Excel" (click)="exportTableToCSV()">
            <i class="fa-regular fa-file-excel fa-xl"></i>
        </button>
        <button mat-icon-button matTooltip="Export Table To PDF" (click)="exportTableToPDF()">
            <i class="fa-regular fa-file-pdf fa-xl"></i>
        </button>
        <button mat-icon-button matTooltip="Generate Invoice" (click)="openInvoiceDialog()">
            <mat-icon>payment</mat-icon>
        </button> -->
    </div>

    <div class="content-wrapper">
        <div class="table-container">
            <div class="mat-elevation-z8" id="claim-disbursement-table">
                <table mat-table [dataSource]="dataSource" matSort class="full-width-table">

                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
                        <td mat-cell *matCellDef="let row"> {{row.date}} </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <ng-container matColumnDef="item">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Item </th>
                        <td mat-cell *matCellDef="let row"> {{row.item_name}} </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <ng-container matColumnDef="units">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Units </th>
                        <td mat-cell *matCellDef="let row"> {{row.units}} </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <ng-container matColumnDef="price_per_unit">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Price Per Unit </th>
                        <td mat-cell *matCellDef="let row"> {{row.price_per_unit | currency}} </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <ng-container matColumnDef="total">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Total </th>
                        <td mat-cell *matCellDef="let row"> {{ getRowTotal(row) | currency }} </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <!-- Fruit Column -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef> Action </th>
                        <td mat-cell *matCellDef="let row">
                            <button mat-icon-button color="accern" (click)="openDialog(row)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" (click)="deleteItem(row.id)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
                    <tr mat-row *matRowDef="let row; columns: columnsToDisplay;"></tr>
                    <tr mat-footer-row *matFooterRowDef="columnsToDisplay" class="example-first-footer-row"></tr>

                    <!-- Row shown when there is no matching data. -->
                    <tr class="mat-row" *matNoDataRow>
                        <!-- <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td> -->
                    </tr>
                </table>

                <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
            </div>
        </div>
    </div>

    <div class="add-btn-wrapper" color="primary">
        <button mat-fab matTooltip="Add Timesheet Item" aria-label="Add Timesheet Button with icon" class="add-btn"
            (click)="openDialog()">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</div>
