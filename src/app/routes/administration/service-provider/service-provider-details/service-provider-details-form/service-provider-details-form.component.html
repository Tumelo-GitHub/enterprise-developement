<form [formGroup]="form" novalidate (ngSubmit)="onSubmit()">
    <h2 mat-dialog-title>Service Provider Information</h2>
    <mat-dialog-content class="mat-typography">
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select cdkFocusInitial placeholder="Service Type" formControlName="service_type" [multiple]="true">
                        <mat-option value="1">Coach</mat-option>
                        <mat-option value="2">Mentor</mat-option>
                        <mat-option value="3">Trainer</mat-option>
                        <mat-option value="4">Consultant</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput placeholder="Name" formControlName="name">
                    <mat-error *ngIf="form.controls['name'].hasError('required')">
                        Name is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput placeholder="Surname" formControlName="surname">
                    <mat-error *ngIf="form.controls['surname'].hasError('required')">
                        Surname is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input type="email" matInput placeholder="Email" formControlName="email">
                    <mat-error *ngIf="form.controls['email'].hasError('required')">
                        Email is <strong>required</strong>
                    </mat-error>
                    <mat-error *ngIf="form.controls['email'].hasError('email')">
                        Invalid email address
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput placeholder="Tell Number" formControlName="tel_number">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput placeholder="Cell Number" formControlName="cell_number">
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput placeholder="Specialization" formControlName="specialization">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <mat-form-field class="full-width">
                <textarea matInput placeholder="Qualification" formControlName="qualification"></textarea>
            </mat-form-field>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cancel</button>
        <button type="submit" mat-button [disabled]="!form.valid">Submit</button>
    </mat-dialog-actions>
</form>
