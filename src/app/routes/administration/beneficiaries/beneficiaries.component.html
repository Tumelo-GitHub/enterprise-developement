<div class="container">
    <div class="page-title">
        <h2>Beneficiaries {{ (company) ? ' : ' + company : '' }}</h2>
    </div>
    <mat-tab-group animationDuration="0ms">
        <mat-tab label="Company">
            <mat-tab-group animationDuration="0ms">
                <mat-tab label="SMME">
                    <app-smme (onCompanySelect)="selectedCompany($event)"></app-smme>
                </mat-tab>
                <mat-tab label="Employee">
                    <app-employee [company_id]="company_id"></app-employee>
                </mat-tab>
                <mat-tab label="Compliance">
                    <app-compliance [company_id]="company_id"></app-compliance>
                </mat-tab>
            </mat-tab-group>
        </mat-tab>
        <mat-tab label="Person">
            <app-person></app-person>
        </mat-tab>
    </mat-tab-group>
</div>
