<form [formGroup]="complianceForm" novalidate (ngSubmit)="onSubmit()">
    <h2 mat-dialog-title>Compliance Information</h2>
    <mat-dialog-content class="mat-typography">
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select cdkFocusInitial placeholder="Type" formControlName="type_id">
                        <mat-option *ngFor="let type of types" value="{{type.id}}">{{type.type_name}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput placeholder="Registration Number" formControlName="registration_num">
                    <mat-error *ngIf="complianceForm.controls['registration_num'].hasError('required')">
                        Registration Number is <strong>required</strong>
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select placeholder="Status" formControlName="status">
                        <mat-option *ngFor="let status of statuses" value="{{status.id}}">{{status.status_name}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Issued date</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="issued_date">
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Expiry date</mat-label>
                    <input matInput [matDatepicker]="picker1" formControlName="expiry_date">
                    <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                    <mat-datepicker #picker1></mat-datepicker>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-select placeholder="Is Verified" formControlName="isVerified">
                        <mat-option value="Yes">Yes</mat-option>
                        <mat-option value="No">No</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col">
                <mat-form-field class="full-width">
                    <input matInput placeholder="Veified Person" formControlName="verified_person">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <input type="file" name="file" accept="application/pdf" placeholder="Compliance Document" (change)="onFileSelect($event)">
            </div>
            <div class="col">
                
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cancel</button>
        <button type="submit" mat-button [disabled]="!complianceForm.valid">Submit</button>
    </mat-dialog-actions>
</form>
