<form (ngSubmit)="submit()" novalidate>
  <h2 mat-dialog-title>{{ data.title }}</h2>

  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ data.label }}</mat-label>
      <input matInput [formControl]="name" cdkFocusInitial autocomplete="off">
      <mat-error *ngIf="name.hasError('required')">{{ data.label }} is <strong>required</strong></mat-error>
      <mat-error *ngIf="name.hasError('maxlength')">Must be 255 characters or fewer</mat-error>
    </mat-form-field>

    <p *ngIf="serverError" class="mat-error" role="alert">{{ serverError }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close [disabled]="saving">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="saving">
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </mat-dialog-actions>
</form>
