<div class="container">
    <div class="page-title">
        <h2>Timesheet Manager</h2>
    </div>
    <mat-form-field>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>
    
    <div class="mat-elevation-z8">
        <div class="table-container">
          <table mat-table [dataSource]="dataSource" matSort class="full-width-table">
      
            <ng-container matColumnDef="project_name">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Project Name </th>
              <td mat-cell *matCellDef="let row"> {{row.project_name}} </td>
            </ng-container>
  
            <ng-container matColumnDef="company_name">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Company Name </th>
              <td mat-cell *matCellDef="let row"> {{row.company_name}} </td>
            </ng-container>
  
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
              <td mat-cell *matCellDef="let row"> {{row.status}} </td>
            </ng-container>
      
            <!-- Action Column -->
            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef> Action </th>
              <td mat-cell *matCellDef="let row">
                  <button mat-icon-button matTooltip="Edit entry" color="accern" (click)="openDialog(row); $event.stopPropagation();">
                      <mat-icon>edit</mat-icon>
                  </button>
                  <button mat-icon-button matTooltip="Delete Company" color="warn" (click)="remove(row); $event.stopPropagation();">
                      <mat-icon>delete</mat-icon>
                  </button>
              </td>
            </ng-container>
        
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr 
              mat-row 
              *matRowDef="let row; columns: displayedColumns;"></tr>
        
            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
            </tr>
          </table>
        </div>
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [showFirstLastButtons]="true" aria-label="Select page of users"></mat-paginator>
      </div>    
      <div class="add-btn-wrapper" color="primary">
        <button mat-fab matTooltip="Add Company" aria-label="Add Employee Button with icon" class="add-btn" (click)="openDialog()">
          <mat-icon>add</mat-icon>
        </button>
      </div>
</div>
