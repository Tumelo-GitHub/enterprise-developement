<div class="container">
    <div class="page-title">
        <h2>Business Developement {{(company) ? ' : ' + company.bdsp_name : ''}}</h2>
    </div>
    <mat-tab-group animationDuration="0ms">
        <mat-tab label="BDSP">
            <app-bdsp (onCompanySelect)="selectedCompany($event)"></app-bdsp>
        </mat-tab>
        <mat-tab label="Employee">
            <app-bdsp-employee [bdsp_id]="id"></app-bdsp-employee>
        </mat-tab>
        <mat-tab label="Programme">
            
        </mat-tab>
    </mat-tab-group>
</div>
