<div *ngIf="loaderService.isLoginLoading$ | async" class="loader-container">
    <mat-spinner style="top: 50%; left: 50%;"></mat-spinner>
</div>
<div class="container">
    <div>
        <mat-card class="login-card">
            <mat-card-content class="content">
                <div class="logo" style="background-image: url(../../../assets/images/logo-no-bg-2.png); background-repeat: no-repeat; background-size: contain;">
                    
                </div>
                <div class="form">
                    <router-outlet></router-outlet>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
